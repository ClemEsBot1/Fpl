name: Social post

# Sends a one-off post written by hand: to Bluesky, and as an X draft by
# email (src/lib/social.js, POST /api/optimal-squad?social=custom). Run it
# from the Actions tab with the text. Needs the CRON_SECRET repo secret.
on:
  workflow_dispatch:
    inputs:
      text:
        description: 'The post (links count as 23 characters on X; 280 max)'
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Find the site's address
        # fplchecker.co.uk may redirect (e.g. to www.), and curl doesn't
        # follow a redirect for a POST, nor send the secret on to another
        # host. So find where it lands first, and only ever send the secret
        # there if it's this site.
        run: |
          site=$(curl -s -o /dev/null -L -w '%{url_effective}' https://fplchecker.co.uk/ | sed 's#/*$##')
          case "$site" in
            https://fplchecker.co.uk|https://www.fplchecker.co.uk) echo "SITE=$site" >> "$GITHUB_ENV"; echo "site: $site" ;;
            *) echo "unexpected address: $site"; exit 1 ;;
          esac
      - name: Send the post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEXT: ${{ inputs.text }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi
          jq -n --arg text "$TEXT" '{text: $text}' > body.json
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "$SITE/api/optimal-squad?social=custom" \
            -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json' --data @body.json)
          jq . out.json || cat out.json
          [ "$code" = "200" ]
