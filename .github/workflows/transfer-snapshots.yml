name: Transfer snapshots

# Calls /api/transfer-trend every 20 minutes so it keeps a snapshot of
# FPL's transfer counts even when nobody has the app open: the home
# screen's "last hour" figures compare with the one about an hour old.
# Also sends pushed alerts (src/lib/push.js) when the CRON_SECRET repo
# secret is set.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -sf -o /dev/null https://fplchecker.vercel.app/api/transfer-trend || true
      - name: Send pushed alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set: skipping"; exit 0; fi
          curl -s -X POST "https://fplchecker.vercel.app/api/auth?push=send" -H "Authorization: Bearer $CRON_SECRET" || true
