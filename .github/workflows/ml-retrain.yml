name: Retrain ML model

# Every day: retrain the points model on every season so far plus this
# season's finished gameweeks, predict the gameweek being planned, and
# commit the predictions to public/ml/ (see scripts/ml/retrain.py). The
# push redeploys the app, and the 06:00 refresh cron in vercel.json then
# builds the optimal squad from the new predictions. Once a gameweek is
# over, its predictions are scored into public/ml/history.json, so you can
# see the model learning week by week. FPL's own figures at each run are
# kept in scripts/ml/data/fpl-snapshots/ for the model too.
on:
  schedule:
    - cron: '17 4 * * *'
    # Every 2 hours, but it only retrains when a deadline is under 6 hours
    # away, so late injury news from press conferences makes it in.
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Near a deadline?
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = '37 */2 * * *' ]; then
            python3 scripts/ml/near_deadline.py 6 || echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/ml/requirements.txt
      - run: pip install -r scripts/ml/requirements.txt
        if: steps.gate.outputs.run == 'true'
      # Past seasons from the archive never change: download them once.
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: scripts/ml/.cache
          key: fpl-archive-${{ github.run_id }}
          restore-keys: fpl-archive-
      - run: python scripts/ml/retrain.py
        if: steps.gate.outputs.run == 'true'
      - name: Commit new predictions
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- public/ml scripts/ml/data/fpl-snapshots && [ -z "$(git ls-files --others --exclude-standard public/ml scripts/ml/data/fpl-snapshots)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/ml scripts/ml/data/fpl-snapshots
          git commit -m "ML: retrained predictions"
          git push
