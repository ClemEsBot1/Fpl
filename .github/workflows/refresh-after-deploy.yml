name: Refresh optimal squad after deploy

# Runs automatically on every push to main, so you never need to manually
# curl /api/refresh-optimal after updating the app — this replaces that
# manual step. The existing daily 6am cron in vercel.json is untouched and
# keeps running regardless; this just also triggers a refresh right after
# each deploy so you see your changes reflected immediately.
on:
  push:
    branches: [main]  # change this if your default branch is called something else (e.g. master)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy to finish
        # This app's build is small (seconds), but Vercel's own deploy
        # pipeline (build + assign the new URL) still takes a bit longer.
        # 90s is a reasoned buffer, not measured against your actual deploy
        # times — if this ever fires before the new code is live (refresh
        # succeeds but doesn't reflect your latest change), bump this up.
        run: sleep 90

      - name: Find the site's address
        # fplchecker.co.uk may redirect (e.g. to www.), and curl doesn't
        # follow a redirect for a POST, nor send the secret on to another
        # host. So find where it lands first, and only ever send the secret
        # there if it's this site.
        run: |
          site=$(curl -s -o /dev/null -L -w '%{url_effective}' https://fplchecker.co.uk/ | sed 's#/*$##')
          case "$site" in
            https://fplchecker.co.uk|https://www.fplchecker.co.uk) echo "SITE=$site" >> "$GITHUB_ENV"; echo "site: $site" ;;
            *) echo "unexpected address: $site"; exit 1 ;;
          esac

      - name: Trigger refresh-optimal
        run: |
          curl -sf -X POST "$SITE/api/refresh-optimal" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
